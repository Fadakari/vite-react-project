<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donate</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            font-family: Tahoma, Arial, sans-serif;
        }

        .card {
            width: 360px;
            padding: 40px;
            background: white;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .amount {
            font-size: 24px;
            font-weight: bold;
            margin: 25px 0;
        }

        button {
            width: 100%;
            border: 0;
            padding: 15px;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>حمایت مالی</h1>

    <div class="amount">
        ۱۵,۰۰۰ تومان
    </div>

    <form method="post" action="{% url 'start_payment' %}">
        {% csrf_token %}

        <button type="submit">
            Donate
        </button>
    </form>

</div>

</body>
</html>
